<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>企业文化刷题</title>
<style>
/* Layout: single narrow column, sticky progress header, fixed bottom action bar; one question per screen */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#1b2130; --muted:#667085; --line:#dfe3ea;
  --accent:#2747b8; --accent-soft:#e7ecfb; --ok:#13804b; --ok-soft:#e3f4ea; --bad:#c2352b; --bad-soft:#fbe7e5;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b1f29; --fg:#e8ebf2; --muted:#98a1b3; --line:#2c3240;
  --accent:#8ea6ff; --accent-soft:#252f52; --ok:#4fc787; --ok-soft:#173326; --bad:#ff8378; --bad-soft:#3d1e1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --fg:#e8ebf2; --muted:#98a1b3; --line:#2c3240;
  --accent:#8ea6ff; --accent-soft:#252f52; --ok:#4fc787; --ok-soft:#173326; --bad:#ff8378; --bad-soft:#3d1e1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
h1{font-size:24px;line-height:1.3;margin:8px 0 4px;text-wrap:balance}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--num);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:48px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--surface);font-weight:600}
.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.link{background:none;color:var(--muted);min-height:40px;padding:8px;font-size:14px;text-decoration:underline}
button:disabled{opacity:.45;cursor:default}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.headrow b{color:var(--fg);font-family:var(--num);font-variant-numeric:tabular-nums}
.qtext{font-size:18px;font-weight:600;line-height:1.55;margin:4px 0 16px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);padding:12px 14px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:1px}
.opt .t{min-width:0;flex:1}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.feedback{margin-top:12px;font-weight:600}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.cell{min-height:44px;padding:0;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font-family:var(--num);font-size:14px}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{font-family:var(--num);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 140px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:6px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.wq{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.wq:first-child{border-top:0;padding-top:0}
.wq .qn{font-size:13px;color:var(--muted);font-family:var(--num)}
.wq .qq{font-weight:600}
.ans{font-size:15px;display:flex;gap:6px;align-items:baseline}
.ans .lbl{flex:none;font-size:12px;padding:1px 6px;border-radius:4px}
.ans.y .lbl{background:var(--bad-soft);color:var(--bad)}
.ans.c .lbl{background:var(--ok-soft);color:var(--ok)}
.ans.c{color:var(--ok);font-weight:600}
.ans.y{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,14,25,.45);display:flex;align-items:flex-end}
.sheet .box{background:var(--bg);width:100%;max-height:75%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .box>div{max-width:640px;margin:0 auto}
/* Login: poster on top fading into dusk; form card below. Fixed dusk palette, independent of theme */
.login{--dusk:#1a120f;--dusk-2:#2a1c16;--ember:#f08a2a;--flame:#e0461f;--sky:#fff3e2;--haze:#c9b3a3;
  position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--dusk);color:var(--sky);color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.login .shell{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.login .poster{position:relative;line-height:0}
.login .poster img{width:100%;height:auto;display:block}
.login .poster::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(to bottom,rgba(26,18,15,0),var(--dusk))}

.login .card{background:var(--dusk-2);border:1px solid rgba(240,138,42,.28);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.login .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ember);margin:0}
.login h1{font-size:22px;margin:0;color:var(--sky);line-height:1.3}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--haze);letter-spacing:.04em}
.login input{font:inherit;font-size:17px;color:var(--sky);background:rgba(0,0,0,.28);border:1.5px solid rgba(255,243,226,.16);border-radius:12px;padding:12px 14px;min-height:50px;transition:border-color .15s,box-shadow .15s}
.login input:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px rgba(240,138,42,.22)}
.login .err{color:#ff9a7f;font-size:14px;margin:0;min-height:1.4em}
.login .go{background:linear-gradient(100deg,var(--ember),var(--flame));color:#fff;font-weight:700;font-size:17px;letter-spacing:.2em;min-height:52px;border-radius:12px;box-shadow:0 8px 20px rgba(224,70,31,.35)}
.login .go:active{transform:translateY(1px)}
.login .motto{text-align:center;font-size:12px;letter-spacing:.32em;color:var(--haze);margin:4px 0 0}
@media (min-width:860px){
  .login .shell{max-width:980px;flex-direction:row;align-items:center;gap:48px;padding:40px 24px;min-height:100%}
  .login .poster{flex:1 1 52%;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .login .poster::after{display:none}
  .login .fields{flex:1 1 48%;margin-top:0!important;padding:0!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<form class="login" id="login" autocomplete="off" hidden>
  <div class="shell">
    <div class="poster"><img src="poster.webp" alt="东呈集团区域经理培训班 Team No.1 海报：谁与争锋，誓夺成功" width="1024" height="1536"></div>
    <div class="fields" style="display:flex;flex-direction:column;gap:14px;position:relative;margin-top:-4px;padding:0 16px 32px">
      <div class="card">
        <div><p class="eyebrow">TEAM NO.1 · 企业文化</p><h1>企业文化刷题</h1></div>
        <label for="lg-user">账号<input id="lg-user" inputmode="numeric" autocapitalize="off" autocomplete="off" placeholder="请输入账号"></label>
        <label for="lg-pass">密码<input id="lg-pass" type="password" inputmode="numeric" autocomplete="off" placeholder="请输入密码"></label>
        <p class="err" id="lg-err" role="alert"></p>
        <button class="go" type="submit">进入刷题</button>
      </div>
      <p class="motto">同心 · 同行 · 同赢</p>
    </div>
  </div>
</form>
<div class="wrap" id="app" hidden></div>

":"弓弩模型中的效率是","o":["是准星、是方向，有助于迅速瞄准、精准触达","是抓手、是后劲，可以让企业走得更远","是弓弦，提供了强劲的拉动力","是核心组成部分"],"a":2,"e":""}];
const N = 50, KEY = 'dc-quiz-v1';
const L = i => String.fromCharCode(65 + i);
let S; // persisted state
function load(){ try{ S = JSON.parse(localStorage.getItem(KEY)) }catch(e){}
  S = Object.assign({seen:{}, wrong:{}, rounds:[], cur:null}, S||{}); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
load();
let view = S.cur ? (S.cur.done ? 'result' : 'quiz') : 'home';
let instant = true; try{ instant = localStorage.getItem(KEY+'-mode') !== 'exam' }catch(e){}
let showGrid = false, confirmSubmit = false, reviewAll = false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function pick(kind){
  let ids = BANK.map((_,i)=>i);
  if(kind==='wrong') ids = Object.keys(S.wrong).map(Number);
  // fewest-seen first, random within each tier -> new questions before repeats
  const tiers = {};
  ids.forEach(i => (tiers[S.seen[i]||0] ??= []).push(i));
  let out = [];
  Object.keys(tiers).map(Number).sort((a,b)=>a-b).forEach(k => out.push(...shuffle(tiers[k])));
  return shuffle(out.slice(0, N));
}
function start(kind){
  const ids = pick(kind);
  if(!ids.length) return;
  S.cur = {kind, ids, ans: Array(ids.length).fill(null), i:0, done:false, t:Date.now()};
  save(); view='quiz'; confirmSubmit=false; render(); scrollTo(0,0);
}
function submit(){
  const c = S.cur; let right=0;
  c.ids.forEach((q,k)=>{
    S.seen[q]=(S.seen[q]||0)+1;
    if(c.ans[k]===BANK[q].a){ right++; if(S.wrong[q]) { S.wrong[q]--; if(S.wrong[q]<=0) delete S.wrong[q]; } }
    else S.wrong[q]=2; // must answer right twice in later rounds to leave the wrong-book
  });
  c.done=true; c.right=right;
  S.rounds.push({t:Date.now(), n:c.ids.length, right, kind:c.kind}); if(S.rounds.length>50) S.rounds.shift();
  save(); view='result'; reviewAll=false; render(); scrollTo(0,0);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function home(){
  const seenN = Object.keys(S.seen).length, wrongN = Object.keys(S.wrong).length;
  const last = S.rounds.slice(-5).reverse();
  return `
  <h1>企业文化刷题</h1>
  <p class="sub">题库共 ${BANK.length} 道单选题 · 每轮 ${N} 题 · 优先出没做过的题</p>
  <div class="panel stack" style="margin-top:16px">
    <div class="stats">
      <div class="stat"><b>${seenN}<small style="font-size:13px;color:var(--muted)">/${BANK.length}</small></b><span>已覆盖题目</span></div>
      <div class="stat"><b>${S.rounds.length}</b><span>已完成轮数</span></div>
      <div class="stat"><b style="color:${wrongN?'var(--bad)':'inherit'}">${wrongN}</b><span>错题本</span></div>
    </div>
    <div class="bar" aria-label="题库覆盖率"><i style="width:${seenN/BANK.length*100}%"></i></div>
    <p class="hint" style="margin:0">${seenN<BANK.length ? `还有 ${BANK.length-seenN} 道题没做过，下一轮会先出这些。` : '全部题目都做过了，之后按做过次数从少到多出题。'}</p>
  </div>
  <div class="stack" style="margin-top:16px">
    <div class="panel stack">
      <h2>答题方式</h2>
      <div class="seg" role="group">
        <button id="m-inst" aria-pressed="${instant}">练习模式：选完立刻看对错</button>
        <button id="m-exam" aria-pressed="${!instant}">考试模式：交卷后看答案</button>
      </div>
    </div>
    <button class="primary" id="go">开始新一轮（${N} 题）</button>
    <button class="ghost" id="gow" ${wrongN?'':'disabled'}>错题专练（${Math.min(wrongN,N)} 题）</button>
  </div>
  ${last.length ? `<div class="panel stack" style="margin-top:16px"><h2>最近成绩</h2>
    ${last.map(r=>`<div class="headrow"><span>${new Date(r.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${r.kind==='wrong'?'错题专练':'新一轮'}</span><b>${r.right}/${r.n}</b></div>`).join('')}
  </div>` : ''}
  <div style="margin-top:16px;text-align:center">
    ${confirmSubmit==='reset' ? `<div class="panel confirm stack"><span>清空所有做题记录、错题本和成绩？</span><div class="row"><button class="ghost" id="rs-no">保留记录</button><button class="primary" id="rs-yes" style="background:var(--bad)">清空记录</button></div></div>`
      : `<button class="link" id="rs">清空做题记录</button>`}
  </div>`;
}

function quiz(){
  const c=S.cur, q=BANK[c.ids[c.i]], a=c.ans[c.i], answered=c.ans.filter(x=>x!==null).length;
  const reveal = instant && a!==null;
  const opts = q.o.map((t,k)=>{
    let cls='opt';
    if(reveal){ if(k===q.a) cls+=' right'; else if(k===a) cls+=' wrong'; }
    else if(k===a) cls+=' sel';
    return `<button class="${cls}" data-o="${k}" ${reveal?'disabled style="opacity:1"':''}><span class="k">${L(k)}</span><span class="t">${esc(t)}</span></button>`;
  }).join('');
  const last = c.i===c.ids.length-1;
  return `
  <div class="head">
    <div class="headrow"><span>${c.kind==='wrong'?'错题专练':'第 '+(S.rounds.length+1)+' 轮'} · 已答 <b>${answered}</b>/${c.ids.length}</span><button class="link" id="quit" style="min-height:32px;padding:0">返回首页</button></div>
    <div class="bar"><i style="width:${answered/c.ids.length*100}%"></i></div>
  </div>
  <div class="panel" style="margin-top:8px">
    ${S.wrong[c.ids[c.i]]?'<span class="tag">之前做错过</span>':''}
    <div class="headrow"><span>第 <b>${c.i+1}</b> 题</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${reveal ? (a===q.a ? `<p class="feedback ok">回答正确</p>` : `<p class="feedback no">回答错误，正确答案：${L(q.a)}</p>`) : ''}
  </div>
  ${confirmSubmit===true ? `<div class="panel confirm stack" style="margin-top:12px">
    <span>${answered<c.ids.length ? `还有 ${c.ids.length-answered} 题没答，未答按错题计。` : '已全部答完。'}确认交卷？</span>
    <div class="row"><button class="ghost" id="sb-no">继续答题</button><button class="primary" id="sb-yes">交卷</button></div></div>` : ''}
  <div class="foot"><div class="in">
    <button class="ghost" id="prev" ${c.i===0?'disabled':''}>上一题</button>
    <button class="ghost" id="card">答题卡</button>
    ${last ? `<button class="primary" id="sub">交卷</button>` : `<button class="primary" id="next">下一题</button>`}
  </div></div>
  ${showGrid ? `<div class="sheet" id="sheet"><div class="box"><div class="stack">
    <div class="headrow"><h2 style="margin:0">答题卡</h2><button class="link" id="sheet-x">关闭</button></div>
    <div class="grid">${c.ids.map((id,k)=>{
      let cl='cell'; const x=c.ans[k];
      if(x!==null) cl += instant ? (x===BANK[id].a?' r':' w') : ' done';
      if(k===c.i) cl+=' cur';
      return `<button class="${cl}" data-j="${k}">${k+1}</button>`}).join('')}</div>
    <button class="primary" id="sub2">交卷</button>
  </div></div></div>` : ''}`;
}

function result(){
  const c=S.cur, right=c.ids.filter((id,k)=>c.ans[k]===BANK[id].a).length, n=c.ids.length;
  const list = c.ids.map((id,k)=>({id,k,q:BANK[id],a:c.ans[k]})).filter(x=> reviewAll || x.a!==x.q.a);
  const wrongN=n-right;
  return `
  <h1>本轮成绩</h1>
  <div class="panel stack" style="margin-top:12px">
    <div class="score">${right}<small> / ${n}</small></div>
    <div class="headrow"><span>正确率 <b>${Math.round(right/n*100)}%</b></span><span>错 <b style="color:var(--bad)">${wrongN}</b> 题</span></div>
    <div class="row"><button class="primary" id="go">再来一轮</button><button class="ghost" id="gow" ${Object.keys(S.wrong).length?'':'disabled'}>错题专练</button></div>
    <button class="link" id="home">返回首页</button>
  </div>
  <div class="panel stack" style="margin-top:16px">
    <div class="headrow"><h2 style="margin:0">${reviewAll?'全部题目':'错题与正确答案'}</h2>
      <div class="seg"><button id="rv-w" aria-pressed="${!reviewAll}">只看错题</button><button id="rv-a" aria-pressed="${reviewAll}">全部</button></div></div>
    ${list.length ? list.map(x=>`<div class="wq">
      <span class="qn">第 ${x.k+1} 题</span>
      <span class="qq">${esc(x.q.q)}</span>
      ${x.a!==x.q.a ? `<div class="ans y"><span class="lbl">你的答案</span><span>${x.a===null?'未作答':L(x.a)+'. '+esc(x.q.o[x.a])}</span></div>`:''}
      <div class="ans c"><span class="lbl">正确答案</span><span>${L(x.q.a)}. ${esc(x.q.o[x.q.a])}</span></div>
    </div>`).join('') : '<p class="sub">这一轮全部答对。</p>'}
  </div>`;
}

const app=document.getElementById('app');
function render(){ app.innerHTML = view==='quiz'?quiz():view==='result'?result():home(); }
function setMode(v){ instant=v; try{ localStorage.setItem(KEY+'-mode', v?'inst':'exam') }catch(e){}; render(); }

app.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const c=S.cur;
  if(b.dataset.o!==undefined){ c.ans[c.i]=+b.dataset.o; save();
    render();
    if(!instant && c.i<c.ids.length-1) setTimeout(()=>{ c.i++; save(); render(); scrollTo(0,0) }, 220);
    return; }
  if(b.dataset.j!==undefined){ c.i=+b.dataset.j; showGrid=false; save(); render(); scrollTo(0,0); return; }
  switch(b.id){
    case 'go': start('all'); break;
    case 'gow': start('wrong'); break;
    case 'm-inst': setMode(true); break;
    case 'm-exam': setMode(false); break;
    case 'next': c.i++; confirmSubmit=false; save(); render(); scrollTo(0,0); break;
    case 'prev': c.i--; confirmSubmit=false; save(); render(); scrollTo(0,0); break;
    case 'card': showGrid=true; render(); break;
    case 'sheet-x': showGrid=false; render(); break;
    case 'sub': case 'sub2': showGrid=false; confirmSubmit=true; render(); scrollTo(0,document.body.scrollHeight); break;
    case 'sb-no': confirmSubmit=false; render(); break;
    case 'sb-yes': confirmSubmit=false; submit(); break;
    case 'quit': view='home'; render(); break; // round kept; resumes from home via 继续
    case 'home': S.cur=null; save(); view='home'; render(); scrollTo(0,0); break;
    case 'resume': view='quiz'; render(); break;
    case 'rv-w': reviewAll=false; render(); break;
    case 'rv-a': reviewAll=true; render(); break;
    case 'rs': confirmSubmit='reset'; render(); break;
    case 'rs-no': confirmSubmit=false; render(); break;
    case 'rs-yes': S={seen:{},wrong:{},rounds:[],cur:null}; save(); confirmSubmit=false; render(); break;
  }
});
app.addEventListener('click', e=>{ if(e.target.id==='sheet'){ showGrid=false; render(); } });

// resume banner on home when a round is unfinished
const _home = home;
home = function(){
  const c=S.cur; let h=_home();
  if(c && !c.done){ const n=c.ans.filter(x=>x!==null).length;
    h = h.replace('<div class="stack" style="margin-top:16px">', `<div class="stack" style="margin-top:16px"><button class="primary" id="resume">继续上次未完成的一轮（已答 ${n}/${c.ids.length}）</button>`); }
  return h;
};
render();
// login gate: account/password checked as SHA-256 of "user:pass"
(function(){
  const HASH='52522718c13f0438833352ab8e5f9ebbbc2340778eabd9476475894835df01ff', AK=KEY+'-auth';
  const form=document.getElementById('login'), appEl=document.getElementById('app');
  const open=()=>{ form.hidden=true; appEl.hidden=false; };
  let ok=false; try{ ok = localStorage.getItem(AK)===HASH }catch(e){}
  if(ok) return open();
  form.hidden=false; 
  async function sha(t){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const u=document.getElementById('lg-user').value.trim(), p=document.getElementById('lg-pass').value.trim(), err=document.getElementById('lg-err');
    if(!u||!p){ err.textContent='请填写账号和密码。'; return; }
    if(await sha(u+':'+p)===HASH){ try{ localStorage.setItem(AK,HASH) }catch(e){}; err.textContent=''; open(); }
    else { err.textContent='账号或密码不正确，请重新输入。'; document.getElementById('lg-pass').value=''; document.getElementById('lg-pass').focus(); }
  });
})();
</script>
